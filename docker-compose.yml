# Local / single-host deployment. For managed cloud, see docs/DEPLOYMENT.md
# (swap postgres/redis/minio for managed services; keep the same env vars).
name: caresync
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: caresync
      POSTGRES_USER: caresync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U caresync"], interval: 10s, retries: 10}
    networks: [backend]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    networks: [backend]

  minio:  # S3-compatible private object storage for self-hosting; use S3/GCS/Azure-compatible in cloud
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      MINIO_KMS_AUTO_ENCRYPTION: "on"
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?set MINIO_KMS_SECRET_KEY}
    volumes: [objdata:/data]
    networks: [backend]

  minio-init:
    image: minio/mc:RELEASE.2025-02-08T19-14-21Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY; do sleep 2; done;
      mc mb -p local/$$S3_BUCKET; mc anonymous set none local/$$S3_BUCKET; mc encrypt set sse-s3 local/$$S3_BUCKET"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-caresync-private}
    networks: [backend]

  migrate:
    build: ./services/api
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment: &apienv
      DATABASE_URL: postgresql+psycopg://caresync:${POSTGRES_PASSWORD}@postgres:5432/caresync
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    depends_on: {postgres: {condition: service_healthy}}
    networks: [backend]

  api:
    build: ./services/api
    env_file: .env
    environment: *apienv
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
      minio-init: {condition: service_completed_successfully}
    networks: [backend, frontend]

  worker:
    build: ./services/api
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment: *apienv
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on: {api: {condition: service_healthy}}
    networks: [backend]

  web:
    build:
      context: ./apps/web
      args: {NEXT_PUBLIC_API_URL: "https://${API_DOMAIN:-api.localhost}"}
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [frontend]

  caddy:  # TLS termination with automatic HTTPS certificates
    image: caddy:2.9-alpine
    ports: ["80:80", "443:443"]
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:-localhost}
      API_DOMAIN: ${API_DOMAIN:-api.localhost}
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro", "caddydata:/data"]
    depends_on: [api, web]
    networks: [frontend]

networks:
  backend: {internal: true}
  frontend: {}

volumes: {pgdata: {}, redisdata: {}, objdata: {}, caddydata: {}}
