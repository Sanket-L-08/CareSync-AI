# Simple local development stack — ports published so VS Code / browser can reach them directly.
# Usage:
#   cp .env.example .env   # fill secrets if needed
#   docker compose -f docker-compose.dev.yml up --build
# Then open:
#   Web:  http://localhost:3000
#   API:  http://localhost:8000
#   Docs: http://localhost:8000/docs

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: caresync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
      POSTGRES_DB: caresync
    ports: ["5432:5432"]
    volumes: [pgdata_dev:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caresync"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-devredis}"]
    ports: ["6379:6379"]
    volumes: [redisdata_dev:/data]

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [objdata_dev:/data]

  minio-init:
    image: minio/mc:RELEASE.2025-02-08T19-14-21Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 $${S3_ACCESS_KEY:-minioadmin} $${S3_SECRET_KEY:-minioadmin}; do sleep 2; done;
      mc mb -p local/$${S3_BUCKET:-caresync-private} || true;
      mc anonymous set none local/$${S3_BUCKET:-caresync-private};
      mc encrypt set sse-s3 local/$${S3_BUCKET:-caresync-private} || true"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-caresync-private}

  migrate:
    build: ./services/api
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://caresync:${POSTGRES_PASSWORD:-devpass}@postgres:5432/caresync
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-secret-key-not-for-production-use-32chars}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      SEED_DEMO: "false"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./services/api
    ports: ["8000:8000"]
    environment: &api_env
      APP_ENV: development
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-secret-key-not-for-production-use-32chars}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      DATABASE_URL: postgresql+psycopg://caresync:${POSTGRES_PASSWORD:-devpass}@postgres:5432/caresync
      REDIS_URL: redis://:${REDIS_PASSWORD:-devredis}@redis:6379/0
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-caresync-private}
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      ALLOWED_HOSTS: "*"
      SEED_DEMO: ${SEED_DEMO:-true}
      REQUIRE_MFA_FOR_STAFF: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata_dev:
  redisdata_dev:
  objdata_dev:
